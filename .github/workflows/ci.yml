name: FairRound checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile && pnpm db:generate
      - run: pnpm test && pnpm typecheck
      - run: node scripts/copy-monaco.mjs && pnpm build
      - run: docker build -t fairround-sandbox-python -f sandbox/python/Dockerfile .
      - run: docker build -t fairround-sandbox-cpp -f sandbox/cpp/Dockerfile .
      - run: pnpm test:judge
      - run: node scripts/init-env.mjs && docker compose up -d --build
      - run: pnpm exec playwright install --with-deps chrome ffmpeg
      - run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/api/health
      - run: pnpm test:e2e
        env:
          TEST_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screens
            playwright-report
          retention-days: 7
